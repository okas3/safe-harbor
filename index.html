<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safe Harbor · Anchor Scriptures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;600&display=swap">
  </head>
  <body>
    <div class="wrap">
      <h1><span class="h1-icon" id="h1IconLeft"></span>Anchor Scriptures<span class="h1-icon" id="h1IconRight"></span></h1>
      <div class="subtitle">Hidden in the heart, so it rises before the escape does</div>

      <div id="view-home" class="view active">
        <div class="cat-header" id="catHeader"></div>
        <div class="verse-list" id="verseList"></div>

        <div class="setup-section">
          <div class="setup-label">Game Mode</div>
          <select class="mode-select" id="modeSelect"></select>
          <div class="mode-desc" id="modeDescText"></div>
        </div>
        <button class="btn primary wide start-btn" onclick="startPractice()">Start Quiz</button>

        <div class="cat-switcher">
          <div class="setup-label">Categories</div>
          <div class="pill-row" id="catPills"></div>
        </div>

        <div class="home-actions"><button class="btn" onclick="openHistory()">View History</button></div>
      </div>

      <div id="view-practice" class="view">
        <div class="top-row">
          <button class="btn" onclick="showView('view-home')">← Home</button>
          <span id="catTitle"></span>
        </div>
        <div class="progress-line" id="progressLine"></div>
        <div class="card-stage">
          <div class="flashcard" id="flashcard"></div>
        </div>
        <div id="rateRow" class="rate-row" style="display:none;"></div>
      </div>

      <div id="view-match" class="view">
        <div class="top-row">
          <button class="btn" onclick="showView('view-home')">← Home</button>
          <span id="matchTitle"></span>
        </div>
        <div class="match-stats" id="matchStats"></div>
        <div class="match-grid">
          <div class="match-col" id="matchRefCol"></div>
          <div class="match-col" id="matchTextCol"></div>
        </div>
      </div>

      <div id="view-score" class="view">
        <div class="score-screen">
          <div class="score-big" id="scoreBig">—</div>
          <div class="score-sub">Score</div>
          <div class="score-meta" id="scoreMeta"></div>
          <div class="score-actions">
            <button class="btn primary wide" onclick="replaySession()">Play Again</button>
            <button class="btn wide" id="reviewBtn" onclick="toggleReview()">Review</button>
            <button class="btn wide" onclick="goHome()">Back to Home</button>
          </div>
          <div class="review-list" id="reviewList" style="display:none;"></div>
        </div>
      </div>

      <div id="view-history" class="view">
        <div class="top-row">
          <button class="btn" onclick="goHome()">← Home</button>
          <span>History</span>
        </div>
        <div id="historyBody"></div>
      </div>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
